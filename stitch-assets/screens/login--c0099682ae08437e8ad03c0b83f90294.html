<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
</div>

</div>
</div>
<div>
<label class="sr-only" for="password">Password</label>

<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-0 bg-surface-container-low text-on-surface rounded-lg focus:ring-2 focus:ring-primary focus:bg-surface-card transition-colors sm:text-sm" id="password" name="password" placeholder="Password" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-low" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">

                            </label>
</div>
<div class="text-sm">
